version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Africa/Douala
    open-pull-requests-limit: 10
    groups:
      npm-patch-and-minor:
        dependency-type: production
        update-types:
          - patch
          - minor

  - package-ecosystem: gradle
    directory: /apps/android
    schedule:
      interval: weekly
      day: monday
      time: "04:45"
      timezone: Africa/Douala
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Africa/Douala
    open-pull-requests-limit: 10
