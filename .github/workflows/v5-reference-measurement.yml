name: Jobly V5 Reference Measurement

on:
  push:
    branches:
      - measure/v5-reference-20260930

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OFFER_MIGRATION_APPLY: "false"
      OFFER_MIGRATION_LIMIT: "254"
      OFFER_MIGRATION_CONCURRENCY: "5"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run V5 canonicalization DRY RUN
        run: node scripts/migrate-offers-to-v5.mjs
      - name: Measure post-V5 reference defects
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const r = JSON.parse(fs.readFileSync("migration-output/offers-migration.json","utf8"));
          const normalize = s => String(s ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9@._%+/-]+/g," ").replace(/\s+/g," ").trim();
          const similarity = (a,b) => {
            const x=normalize(a), y=normalize(b);
            if(!x||!y) return 0;
            if(x===y) return 1;
            if(x.includes(y)||y.includes(x)) return Math.min(x.length,y.length)/Math.max(x.length,y.length);
            const A=new Set(x.split(" ")), B=new Set(y.split(" "));
            const inter=[...A].filter(v=>B.has(v)).length;
            return inter/Math.max(1,new Set([...A,...B]).size);
          };
          const dupCount = sections => {
            const owners=[]; let dup=0;
            for(const [section,vals] of Object.entries(sections||{})) for(const value of vals||[]){
              const s=normalize(value); if(!s) continue;
              const existing=owners.find(item=>item.section!==section && similarity(item.value,value)>=0.92);
              if(existing) dup++; else owners.push({value,section});
            }
            return dup;
          };
          const sectionKeys=["description","missions","profile","education","experience","skills","qualities","benefits","application"];
          const beforeDuplication = 132;
          const afterDuplication = r.results.reduce((sum,x) => sum + dupCount(Object.fromEntries(sectionKeys.map(k => [k, x.canonical?.[k] || []]))), 0);
          const resolvedDuplication = Math.max(0,beforeDuplication-afterDuplication);
          const duplicationResolutionRate = beforeDuplication ? resolvedDuplication/beforeDuplication : 0;
          const beforeApplicationMisclassified = 175;
          const afterApplicationLeak = r.results.filter(x => (x.issues || []).includes("APPLICATION_LEAK")).length;
          const resolvedApplicationMisclassified = Math.max(0,beforeApplicationMisclassified-afterApplicationLeak);
          const applicationResolutionRate = beforeApplicationMisclassified ? resolvedApplicationMisclassified/beforeApplicationMisclassified : 0;
          const summary = {
            baselineApplicationMisclassified: beforeApplicationMisclassified,
            postV5ApplicationLeak: afterApplicationLeak,
            resolvedApplicationMisclassified: resolvedApplicationMisclassified,
            applicationResolutionRate: applicationResolutionRate,
            baselineDuplication: beforeDuplication,
            postV5Duplication: afterDuplication,
            resolvedDuplication: resolvedDuplication,
            duplicationResolutionRate: duplicationResolutionRate,
            audited: r.total,
            pass: r.pass,
            warning: r.warning,
            blocked: r.blocked,
            applied: r.applied,
            mode: r.mode,
            targetVersion: r.targetVersion
          };
          fs.writeFileSync("migration-output/reference-measurement.json", JSON.stringify(summary,null,2));
          console.log(JSON.stringify(summary,null,2));
          NODE
      - name: Publish reference measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jobly-v5-reference-measurement
          path: migration-output/
          if-no-files-found: warn

# trigger third push
