name: Export Jobly source with core documents

on:
  push:
    branches:
      - export/jobly-source-minimal-20261120
    paths:
      - ".github/workflows/minimal-source-export.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout export branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Assemble minimal source and selected documents from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          STAGE="$RUNNER_TEMP/jobly-source"
          DOCS="$RUNNER_TEMP/jobly-docs"
          mkdir -p "$STAGE" "$DOCS"

          # Application source from the current main branch.
          git archive --format=tar origin/main \
            .env.example .gitignore package.json pnpm-lock.yaml next-env.d.ts \
            next.config.mjs postcss.config.js tailwind.config.ts tsconfig.json vercel.json \
            app apps components data lib packages public scripts src supabase tools \
            | tar -xf - -C "$STAGE"

          # Curated project reference documents (no old logs, media, or bulk audit archive).
          ROOT_DOCS=(
            A_CONFIGURER.md ATS-DOCUMENTATION.md SECURITY-CORE.md STATUS.md
            DESIGN-SYSTEM-v2.0.md
            AFRICA-MATRIX-IMPLEMENTATION-2026-10-03.md AUDIT-SOURCE-ENGINE-AFRICA-V1.md
            JIA_DOCTRINE.md JIA_20_20_MASTER_PLAN.md JIA-CRITICAL-9-GATE-2026-10-01.md
            DEPLOY-JIA-SUPABASE.md VERCEL-DEPLOY.md PASSAGE_EN_PRODUCTION.md
            RECRUITMENT360-FINAL-AUDIT-2026-10-02.md RECRUITMENT360-LOT11-REPORT-2026-10-02.md
            JOBLY-MOBILITY-BLUEPRINT-2026-10-02.md
            JOBLY-MOBILITY-TARGET-DATA-ARCHITECTURE-2026-10-02.md
            JOBLY-MOBILITY-P1-REMEDIATION-2026-11-05.md
          )
          for file in "${ROOT_DOCS[@]}"; do
            git show "origin/main:$file" > "$DOCS/$file"
          done

          mkdir -p "$STAGE/docs/reference/root" "$STAGE/docs/reference/jia-360" \
            "$STAGE/docs/reference/database" "$STAGE/docs/reference/payments" \
            "$STAGE/docs/reference/operations" "$STAGE/docs/reference/africa" \
            "$STAGE/docs/reference/career-journey"

          cp "$DOCS"/* "$STAGE/docs/reference/root/"
          git show origin/main:docs/JIA-360/MASTER-SPEC.md > "$STAGE/docs/reference/jia-360/MASTER-SPEC.md"
          git show origin/main:docs/JIA-360/IMPLEMENTATION-LOG.md > "$STAGE/docs/reference/jia-360/IMPLEMENTATION-LOG.md"
          git show origin/main:docs/JIA-COGNITIVE-CORE.md > "$STAGE/docs/reference/jia-360/COGNITIVE-CORE.md"
          git show origin/main:docs/JIA-INTERNET-BRAIN.md > "$STAGE/docs/reference/jia-360/INTERNET-BRAIN.md"
          git show origin/main:docs/JIA_WATCH_LOT_B_STATUS.md > "$STAGE/docs/reference/jia-360/WATCH-LOT-B-STATUS.md"
          git show origin/main:docs/JIA_CAREER_JOURNEY_SPEC.md > "$STAGE/docs/reference/career-journey/SPEC.md"
          git show origin/main:docs/JIA_CAREER_JOURNEY_IMPLEMENTATION_STATUS.md > "$STAGE/docs/reference/career-journey/IMPLEMENTATION-STATUS.md"
          git show origin/main:docs/database/PRODUCTION-DB-RUNBOOK.md > "$STAGE/docs/reference/database/PRODUCTION-DB-RUNBOOK.md"
          git show origin/main:docs/payments/mobile-money-sms.md > "$STAGE/docs/reference/payments/MOBILE-MONEY-SMS.md"
          git show origin/main:docs/operations/P2_SUPABASE_HARDENING_2026-11-05.md > "$STAGE/docs/reference/operations/SUPABASE-HARDENING.md"
          git show origin/main:docs/africa-audit.md > "$STAGE/docs/reference/africa/AFRICA-AUDIT.md"

          cat > "$STAGE/docs/README.md" <<'EOF'
          # Jobly — documentation essentielle

          Cette archive réunit le code source minimal et une sélection de documents de référence issus de la branche `main`.

          ## Documents inclus
          - Configuration, sécurité, ATS et design system
          - Mission Afrique : matrice et audit du moteur de sources
          - J’IA 360 : doctrine, master plan, spécifications, cerveau cognitif et Internet Brain
          - Career Journey : spécification et état d’implémentation
          - Recruitment 360 : audit final et lot 11
          - Mobility : blueprint, architecture cible et remédiation P1
          - Exploitation : runbook base de données, durcissement Supabase, paiements SMS
          - Déploiement : Vercel, Supabase et passage en production

          Les rapports historiques redondants, journaux, captures, images, vidéos, modèles 3D et archives binaires ne sont pas inclus.
          EOF

          # Remove non-source media and binary attachments from the source tree.
          find "$STAGE" -type f \( \
            -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o \
            -iname '*.gif' -o -iname '*.webp' -o -iname '*.avif' -o \
            -iname '*.bmp' -o -iname '*.tif' -o -iname '*.tiff' -o \
            -iname '*.ico' -o -iname '*.mp4' -o -iname '*.webm' -o \
            -iname '*.mov' -o -iname '*.mp3' -o -iname '*.wav' -o \
            -iname '*.ogg' -o -iname '*.glb' -o -iname '*.gltf' -o \
            -iname '*.zip' -o -iname '*.rar' -o -iname '*.7z' -o \
            -iname '*.pdf' \
          \) -delete
          find "$STAGE" -depth -type d -empty -delete

          cd "$STAGE"
          zip -qr "$GITHUB_WORKSPACE/Jobly-source-minimal-docs.zip" .

          echo "FILES=$(find . -type f | wc -l)" >> "$GITHUB_ENV"
          echo "SIZE=$(stat -c%s "$GITHUB_WORKSPACE/Jobly-source-minimal-docs.zip")" >> "$GITHUB_ENV"

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: jobly-source-minimal-docs
          path: Jobly-source-minimal-docs.zip
          if-no-files-found: error
          retention-days: 1
