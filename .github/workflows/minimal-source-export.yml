name: Export Jobly minimal source ZIP

on:
  push:
    branches:
      - export/jobly-source-minimal-20261120
    paths:
      - ".github/workflows/minimal-source-export.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Assemble minimal source tree
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/jobly-source"
          mkdir -p "$STAGE"
          git archive --format=tar HEAD \
            .env.example .gitignore package.json pnpm-lock.yaml next-env.d.ts \
            next.config.mjs postcss.config.js tailwind.config.ts tsconfig.json vercel.json \
            app apps components data lib packages public scripts src supabase tools \
            | tar -xf - -C "$STAGE"

          # Remove media, generated previews, archives and document attachments.
          find "$STAGE" -type f \( \
            -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o \
            -iname '*.gif' -o -iname '*.webp' -o -iname '*.avif' -o \
            -iname '*.bmp' -o -iname '*.tif' -o -iname '*.tiff' -o \
            -iname '*.svg' -o -iname '*.ico' -o \
            -iname '*.mp4' -o -iname '*.webm' -o -iname '*.mov' -o \
            -iname '*.mp3' -o -iname '*.wav' -o -iname '*.ogg' -o \
            -iname '*.glb' -o -iname '*.gltf' -o \
            -iname '*.zip' -o -iname '*.rar' -o -iname '*.7z' -o \
            -iname '*.pdf' \
          \) -delete
          find "$STAGE" -depth -type d -empty -delete

          cat > "$STAGE/README.md" <<'EOF'
          # Jobly — source essentiel

          Archive de code source basée sur la branche `main`.

          ## Prérequis
          - Node.js >= 20.9
          - pnpm

          ## Installation
          ```bash
          pnpm install --frozen-lockfile
          cp .env.example .env.local
          ```

          Renseigner les variables nécessaires dans `.env.local`, puis lancer :
          ```bash
          pnpm dev
          ```

          Les médias, images, vidéos, modèles 3D, documents joints et historiques de rapports ont été omis volontairement.
          EOF

          cd "$STAGE"
          zip -qr "$GITHUB_WORKSPACE/Jobly-source-minimal.zip" .

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: jobly-source-minimal
          path: Jobly-source-minimal.zip
          if-no-files-found: error
          retention-days: 1
