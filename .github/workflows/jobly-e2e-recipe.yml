name: Jobly — Recette E2E isolée

# Same 11-lot orchestrator for Windows local runs and CI.
on:
  workflow_dispatch:
  push:
    branches:
      - e2e/recette
    paths:
      - "e2e/**"
      - ".github/workflows/jobly-e2e-recipe.yml"
      - "app/**"
      - "components/**"
      - "lib/**"
      - "scripts/**"
      - "supabase/migrations/**"
      - ".github/workflows/jobly-security-core.yml"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

concurrency:
  group: jobly-e2e-recipe-\${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-recipe:
    name: Jobly — recette complète en 11 lots
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      E2E_PROJECT_REF: ofqqrryamslxoqkklraw
      NEXT_PUBLIC_SUPABASE_URL: https://ofqqrryamslxoqkklraw.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Z9_IW1X9Um0J7d7kOWXjWg_ua9Hvg9y
      NODE_ENV: production
      E2E_BULK_CONCURRENCY: "3"
    steps:
      - name: Checkout exact recipe commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install application dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install pinned Playwright runtime
        run: |
          npm install --prefix .e2e-tools --no-save --no-package-lock playwright@1.65.0
          ./.e2e-tools/node_modules/.bin/playwright install --with-deps chromium

      - name: Assert JOBLY-E2E configuration
        shell: bash
        run: |
          test "$E2E_PROJECT_REF" = "ofqqrryamslxoqkklraw"
          test "$NEXT_PUBLIC_SUPABASE_URL" = "https://ofqqrryamslxoqkklraw.supabase.co"
          if [[ "$NEXT_PUBLIC_SUPABASE_URL" == *"mpoyaegtwtmhookdzqdy"* ]]; then
            echo "::error::Production Supabase URL is forbidden in the E2E workflow."
            exit 1
          fi
          mkdir -p artifacts/e2e

      - name: Run complete 11-lot E2E recipe
        run: node scripts/e2e-local-recipe.mjs

      - name: Upload consolidated report, logs and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jobly-e2e-recipe-\${{ github.run_id }}
          path: |
            artifacts/e2e/
            feedback-e2e-recette-complete.txt
          if-no-files-found: warn
          retention-days: 14
