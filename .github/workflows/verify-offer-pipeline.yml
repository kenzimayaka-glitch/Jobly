name: Verify offer pipeline

on:
  push:
    branches:
      - main
      - "fix/offer-pipeline-final-validation"
      - "e2e/recette"
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Test bounded Supabase ID batches
        run: node --test scripts/lib/supabase-batch-query.test.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Test Gemini offer normalization and adaptive display contract
        run: deno test supabase/functions/job-offer-ai-normalize/normalizer.test.ts
      - name: Test source-only promoter applications and J’IA handoff
        run: node --test scripts/external-application-assistant.test.mjs scripts/jia-extension-onboarding.test.mjs
      - name: Type-check Gemini offer normalization function
        run: deno check --node-modules-dir=auto supabase/functions/job-offer-ai-normalize/index.ts
      - name: Run Africa bulk and snapshot launcher guardrails
        run: node --test scripts/runtime-readonly-lots.test.mjs
      - name: Type-check Africa bulk integration recipe and real Edge Function logic
        run: deno check --node-modules-dir=none e2e/africa-bulk-recipe.ts
      - run: pnpm typecheck
      - run: pnpm build
      - name: J'IA Watch B3.1 smoke
        run: node scripts/jia-watch-intelligence-smoke.mjs
