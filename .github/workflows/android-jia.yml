name: Android J'IA WebView

on:
  pull_request:
    paths:
      - "apps/android/**"
      - "scripts/payment-sms-android.test.mjs"
      - "lib/paymentSms/android-bridge.ts"
      - "app/admin/page.tsx"
      - "app/admin/payments/sms/**"
      - "app/jia/android-assist/**"
      - "lib/jia/android-bridge.ts"
      - "app/jobs/[id]/page.tsx"
      - "components/JiaPresence.tsx"
      - "components/jia/**"
      - "lib/jia/experience-engine.ts"
      - "lib/jia/workspace.ts"
      - "scripts/jia-experience-engine.test.mjs"
      - "scripts/jia-workspace.test.mjs"
      - "components/JoblyOfferFeed.tsx"
      - "scripts/android-jia-bridge.test.mjs"
      - ".github/workflows/android-jia.yml"
  push:
    branches:
      - main
    paths:
      - "apps/android/**"
      - "app/jia/android-assist/**"
      - "lib/jia/android-bridge.ts"
      - "app/jobs/[id]/page.tsx"
      - "components/JiaPresence.tsx"
      - "components/jia/**"
      - "lib/jia/experience-engine.ts"
      - "lib/jia/workspace.ts"
      - "scripts/jia-experience-engine.test.mjs"
      - "scripts/jia-workspace.test.mjs"
      - "scripts/android-jia-bridge.test.mjs"
      - ".github/workflows/android-jia.yml"

permissions:
  contents: read

jobs:
  privacy-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/android-jia-bridge.test.mjs scripts/payment-sms-android.test.mjs

  android-debug-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Assemble debug APK
        run: gradle -p apps/android :app:assembleDebug --stacktrace
      - name: Upload Play-safe and internal debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: jobly-android-debug-apks
          path: apps/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Build Google Play release AAB for manifest and R8 validation
        run: gradle -p apps/android :app:bundlePlayRelease --stacktrace
      - name: Upload unsigned Google Play release AAB
        uses: actions/upload-artifact@v4
        with:
          name: jobly-android-play-release-validation-unsigned-aab
          path: apps/android/app/build/outputs/bundle/playRelease/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Verify packaged Play and internal manifest separation
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t play_manifests < <(find apps/android/app/build/intermediates -type f -path '*/playRelease/*' -name AndroidManifest.xml)
          mapfile -t internal_manifests < <(find apps/android/app/build/intermediates -type f -path '*/internalDebug/*' -name AndroidManifest.xml)
          test "${#play_manifests[@]}" -gt 0
          test "${#internal_manifests[@]}" -gt 0
          for manifest in "${play_manifests[@]}"; do
            if grep -Eq 'android.permission.(RECEIVE_SMS|READ_SMS)|PaymentSmsReceiver' "$manifest"; then
              echo "Restricted SMS permission or receiver leaked into Play manifest: $manifest"
              exit 1
            fi
          done
          internal_has_receiver=false
          for manifest in "${internal_manifests[@]}"; do
            if grep -q 'android.permission.RECEIVE_SMS' "$manifest" && grep -q 'PaymentSmsReceiver' "$manifest"; then
              internal_has_receiver=true
            fi
          done
          test "$internal_has_receiver" = true


  android-emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "emulator platform-tools platforms;android-36 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Enable KVM for hardware-accelerated emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android instrumentation test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          disable-animations: true
          script: |
            adb devices -l
            trap 'adb logcat -d -t 500 || true' EXIT
            timeout 12m gradle -p apps/android --no-daemon --console=plain -PjoblyBaseUrl=https://jobly.test :app:connectedPlayDebugAndroidTest :app:connectedInternalDebugAndroidTest --stacktrace
