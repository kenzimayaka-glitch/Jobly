name: Android J'IA WebView

on:
  pull_request:
    paths:
      - "apps/android/**"
      - "scripts/payment-sms-android.test.mjs"
      - "scripts/android-integrity.test.mjs"
      - "lib/paymentSms/android-bridge.ts"
      - "app/admin/page.tsx"
      - "app/admin/payments/sms/**"
      - "app/jia/android-assist/**"
      - "lib/jia/android-bridge.ts"
      - "app/jobs/[id]/page.tsx"
      - "components/JiaPresence.tsx"
      - "components/jia/**"
      - "lib/jia/experience-engine.ts"
      - "lib/jia/workspace.ts"
      - "scripts/jia-experience-engine.test.mjs"
      - "scripts/jia-workspace.test.mjs"
      - "components/JoblyOfferFeed.tsx"
      - "scripts/android-jia-bridge.test.mjs"
      - "scripts/android-integrity.test.mjs"
      - ".github/workflows/android-jia.yml"
  push:
    branches:
      - main
    paths:
      - "apps/android/**"
      - "app/jia/android-assist/**"
      - "lib/jia/android-bridge.ts"
      - "app/jobs/[id]/page.tsx"
      - "components/JiaPresence.tsx"
      - "components/jia/**"
      - "lib/jia/experience-engine.ts"
      - "lib/jia/workspace.ts"
      - "scripts/jia-experience-engine.test.mjs"
      - "scripts/jia-workspace.test.mjs"
      - "scripts/android-jia-bridge.test.mjs"
      - ".github/workflows/android-jia.yml"

permissions:
  contents: read

jobs:
  privacy-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/android-jia-bridge.test.mjs scripts/payment-sms-android.test.mjs
      - name: Android APK integrity regression tests
        run: node --test scripts/android-integrity.test.mjs

  android-debug-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Assemble debug APK
        run: gradle -p apps/android :app:assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jobly-android-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  android-emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "emulator platform-tools platforms;android-36 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Enable KVM for hardware-accelerated emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android instrumentation test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          disable-animations: true
          script: |
            adb devices -l
            trap 'adb logcat -d -t 500 || true' EXIT
            timeout 12m gradle -p apps/android --no-daemon --console=plain -PjoblyBaseUrl=https://jobly.test :app:connectedDebugAndroidTest --stacktrace
