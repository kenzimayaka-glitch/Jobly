name: Android J'IA WebView

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/android/**"
      - "scripts/payment-sms-android.test.mjs"
      - "scripts/android-integrity.test.mjs"
      - "scripts/android-key-attestation.test.mjs"
      - "app/api/android/attestation/**"
      - "lib/android-key-attestation.ts"
      - "lib/server-auth.ts"
      - "lib/session-manager.ts"
      - "components/AndroidAttestationBootstrap.tsx"
      - "app/layout.tsx"
      - "supabase/migrations/*android_hardware_key_attestation.sql"
      - "lib/paymentSms/android-bridge.ts"
      - "app/admin/page.tsx"
      - "app/admin/payments/sms/**"
      - "app/jia/android-assist/**"
      - "lib/jia/android-bridge.ts"
      - "app/jobs/[id]/page.tsx"
      - "components/JiaPresence.tsx"
      - "components/jia/**"
      - "lib/jia/experience-engine.ts"
      - "lib/jia/workspace.ts"
      - "scripts/jia-experience-engine.test.mjs"
      - "scripts/jia-workspace.test.mjs"
      - "components/JoblyOfferFeed.tsx"
      - "scripts/android-jia-bridge.test.mjs"
      - ".github/workflows/android-jia.yml"
  push:
    branches:
      - main
      - "security/**"
    paths:
      - "apps/android/**"
      - "app/jia/android-assist/**"
      - "lib/jia/android-bridge.ts"
      - "app/jobs/[id]/page.tsx"
      - "components/JiaPresence.tsx"
      - "components/jia/**"
      - "lib/jia/experience-engine.ts"
      - "lib/jia/workspace.ts"
      - "scripts/jia-experience-engine.test.mjs"
      - "scripts/jia-workspace.test.mjs"
      - "scripts/android-jia-bridge.test.mjs"
      - "scripts/android-integrity.test.mjs"
      - "scripts/android-key-attestation.test.mjs"
      - "app/api/android/attestation/**"
      - "lib/android-key-attestation.ts"
      - "lib/server-auth.ts"
      - "lib/session-manager.ts"
      - "components/AndroidAttestationBootstrap.tsx"
      - "app/layout.tsx"
      - "supabase/migrations/*android_hardware_key_attestation.sql"
      - ".github/workflows/android-jia.yml"

permissions:
  contents: read

jobs:
  privacy-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/android-jia-bridge.test.mjs scripts/payment-sms-android.test.mjs
      - name: Android APK integrity regression tests
        run: node --test scripts/android-integrity.test.mjs
      - name: Android hardware attestation server regression tests
        run: node --experimental-strip-types --test scripts/android-key-attestation.test.mjs

  android-debug-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Assemble debug APK
        run: gradle -p apps/android :app:assembleDebug --stacktrace
      - name: Assert unsigned release APKs are rejected
        shell: bash
        run: |
          set +e
          env -u JOBLY_ANDROID_KEYSTORE_PATH \\
              -u JOBLY_ANDROID_KEYSTORE_PASSWORD \\
              -u JOBLY_ANDROID_KEY_ALIAS \\
              -u JOBLY_ANDROID_KEY_PASSWORD \\
              -u JOBLY_ANDROID_RELEASE_CERT_SHA256 \\
              gradle -p apps/android :app:assembleRelease > /tmp/jobly-release-guard.log 2>&1
          status=$?
          set -e
          cat /tmp/jobly-release-guard.log
          if [ "$status" -eq 0 ]; then
            echo "Release build unexpectedly accepted missing signing credentials."
            exit 1
          fi
          grep -F "Release APK signing is mandatory" /tmp/jobly-release-guard.log
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jobly-android-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  android-emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "emulator platform-tools platforms;android-36 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Enable KVM for hardware-accelerated emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android instrumentation test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          disable-animations: true
          script: |
            adb devices -l
            trap 'adb logcat -d -t 500 || true' EXIT
            timeout 12m gradle -p apps/android --no-daemon --console=plain -PjoblyBaseUrl=https://jobly.test :app:connectedDebugAndroidTest --stacktrace


  android-release-build:
    if: ${{ github.event_name != 'pull_request' && vars.JOBLY_ANDROID_RELEASE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      JOBLY_ANDROID_KEYSTORE_BASE64: ${{ secrets.JOBLY_ANDROID_KEYSTORE_BASE64 }}
      JOBLY_ANDROID_KEYSTORE_PATH: /tmp/jobly-release.p12
      JOBLY_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.JOBLY_ANDROID_KEYSTORE_PASSWORD }}
      JOBLY_ANDROID_KEY_ALIAS: ${{ secrets.JOBLY_ANDROID_KEY_ALIAS }}
      JOBLY_ANDROID_KEY_PASSWORD: ${{ secrets.JOBLY_ANDROID_KEY_PASSWORD }}
      JOBLY_ANDROID_RELEASE_CERT_SHA256: ${{ secrets.JOBLY_ANDROID_RELEASE_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Validate signing secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in JOBLY_ANDROID_KEYSTORE_BASE64 JOBLY_ANDROID_KEYSTORE_PASSWORD JOBLY_ANDROID_KEY_ALIAS JOBLY_ANDROID_KEY_PASSWORD JOBLY_ANDROID_RELEASE_CERT_SHA256; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required signing secret: $name" >&2
              exit 1
            fi
          done
      - name: Materialize keystore securely
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$JOBLY_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$JOBLY_ANDROID_KEYSTORE_PATH"
          chmod 600 "$JOBLY_ANDROID_KEYSTORE_PATH"
          test -s "$JOBLY_ANDROID_KEYSTORE_PATH"
      - name: Verify release certificate fingerprint
        shell: bash
        run: |
          set -euo pipefail
          actual="$(keytool -exportcert -storetype PKCS12 -keystore "$JOBLY_ANDROID_KEYSTORE_PATH" -storepass "$JOBLY_ANDROID_KEYSTORE_PASSWORD" -alias "$JOBLY_ANDROID_KEY_ALIAS" | sha256sum | cut -d ' ' -f1 | tr '[:lower:]' '[:upper:]')"
          expected="$(printf '%s' "$JOBLY_ANDROID_RELEASE_CERT_SHA256" | tr -d ' :\r\n' | tr '[:lower:]' '[:upper:]')"
          if [[ "$actual" != "$expected" ]]; then
            echo "Configured certificate fingerprint does not match the keystore." >&2
            exit 1
          fi
          echo "Android release certificate fingerprint verified."
      - name: Assemble signed release APK
        run: gradle -p apps/android :app:assembleRelease --stacktrace
      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: jobly-android-release-apk
          path: apps/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
