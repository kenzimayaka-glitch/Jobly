name: Android J'IA WebView

on:
  pull_request:
    paths:
      - "apps/android/**"
      - "app/jia/android-assist/**"
      - "lib/jia/android-bridge.ts"
      - "app/jobs/[id]/page.tsx"
      - "scripts/android-jia-bridge.test.mjs"
      - ".github/workflows/android-jia.yml"
  push:
    branches:
      - main
    paths:
      - "apps/android/**"
      - "app/jia/android-assist/**"
      - "lib/jia/android-bridge.ts"
      - "app/jobs/[id]/page.tsx"
      - "scripts/android-jia-bridge.test.mjs"
      - ".github/workflows/android-jia.yml"

permissions:
  contents: read

jobs:
  privacy-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/android-jia-bridge.test.mjs

  android-debug-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Assemble debug APK
        run: gradle -p apps/android :app:assembleDebug --stacktrace
