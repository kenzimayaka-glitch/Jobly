name: offer source debug

on:
  push:
    branches:
      - "fix/offer-360-audit"

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm dlx @playwright/test@1.55.0 install --with-deps chromium
      - run: pnpm dlx @playwright/test@1.55.0 test scripts/offer-debug.spec.ts --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offer-source-debug
          path: debug-*
          if-no-files-found: warn
