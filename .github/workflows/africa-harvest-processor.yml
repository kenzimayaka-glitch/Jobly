name: Africa Harvest Processor

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/africa-harvest-processor.yml"
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: "Autoriser explicitement le traitement des offres du lot"
        required: true
        type: boolean
        default: false
      source_keys:
        description: "Clés des sources à traiter (20 maximum, séparées par des virgules)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: africa-harvest-processor
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - partition: "01"
            source_keys: "jobivoire_ci"
          - partition: "02"
            source_keys: "ajirika_east,unjobnet,onape_td,emplois_cameroun,jobinfocamer,goafricajobs,unjobs_africa"
          - partition: "03"
            source_keys: "work_ke,pnet,jobberman_ng,brightermonday_ug,jobberman_gh,africarrieres,careers_sl"
          - partition: "04"
            source_keys: "fuzu,emploiscongo_cd,ktzemploi_cf,kaziqo_cd"
          - partition: "05"
            source_keys: "recruteo_mg,jobincamer,congojob_cd,ajar_cd,burundijobs,vacancyupdate_za,emploidakar_sn,lesotho_gov_jobs,onem_cd,infosconcourseducation,banguiconnect,jobcomgh,tchad_emploi,brightermonday_ke,jobweb_ghana,mae_bi,minajobs_rss,unjobs"
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Test harvest normalization rules
        run: deno test supabase/functions/job-harvest-process/processor-logic.test.ts supabase/functions/_shared/application-contact.test.ts
      - name: Type-check harvest processor
        run: deno check --node-modules-dir=auto --config=supabase/functions/job-harvest-process/deno.json supabase/functions/job-harvest-process/index.ts
      - name: Process pending captures (scheduled batch 1; manual approval)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.apply == true && matrix.partition == '01') || (github.event_name == 'push' && contains(github.event.head_commit.message, 'JOBLY-PENDING-DRAIN-20261105'))
        env:
          PROCESS_URL: https://mpoyaegtwtmhookdzqdy.supabase.co/functions/v1/job-harvest-process
          SOURCE_KEYS: ${{ github.event_name == 'workflow_dispatch' && inputs.source_keys || matrix.source_keys }}
          DRAIN_ALL: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'JOBLY-PENDING-DRAIN-20261105') }}
        run: |
          BODY="$(python - <<'PY'
          import json, os
          keys = list(dict.fromkeys(x.strip() for x in os.environ["SOURCE_KEYS"].split(",") if x.strip()))
          if len(keys) > 20:
              raise SystemExit("A processing batch is limited to 20 source keys.")
          if os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch" and not keys:
              raise SystemExit("Manual processing requires at least one source key.")
          body = {"limit":40}
          if keys:
              body["sourceKeys"] = keys
          print(json.dumps(body))
          PY
          )"
          PASSES=1
          if [ "$DRAIN_ALL" = "true" ] || [ "$GITHUB_EVENT_NAME" = "schedule" ]; then PASSES=20; fi
          for pass in $(seq 1 "$PASSES"); do
            OIDC_TOKEN="$(curl --fail-with-body --silent --show-error -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=jobly-harvest")"
            TOKEN="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$OIDC_TOKEN")"
            test -n "$TOKEN" || { echo "GitHub Actions OIDC token unavailable"; exit 1; }
            echo "Pending capture processing pass $pass/$PASSES"
            RESPONSE_FILE="$(mktemp)"
            HTTP_STATUS=""
            for attempt in 1 2 3 4; do
              : > "$RESPONSE_FILE"
              HTTP_STATUS="$(curl --silent --show-error --output "$RESPONSE_FILE" --write-out '%{http_code}' -X POST "$PROCESS_URL" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data "$BODY" || true)"
              if [[ "$HTTP_STATUS" =~ ^2[0-9][0-9]$ ]]; then
                break
              fi
              echo "Harvest processor HTTP $HTTP_STATUS on attempt $attempt/4"
              if [ "$attempt" -lt 4 ]; then sleep 5; fi
            done
            RESPONSE="$(cat "$RESPONSE_FILE")"
            rm -f "$RESPONSE_FILE"
            if ! [[ "$HTTP_STATUS" =~ ^2[0-9][0-9]$ ]]; then
              echo "$RESPONSE"
              exit 1
            fi
            echo "$RESPONSE"
            SELECTED="$(python -c 'import json,sys; print(int(json.load(sys.stdin).get("selected",0)))' <<< "$RESPONSE")"
            if [ "$SELECTED" -lt 40 ]; then break; fi
          done
