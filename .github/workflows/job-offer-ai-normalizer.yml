name: Job Offer AI Normalizer

on:
  schedule:
    - cron: "23 */2 * * *"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Nombre d'offres à analyser dans un seul appel Gemini (1 à 10)"
        required: true
        type: number
        default: 5

permissions:
  contents: read
  id-token: write

concurrency:
  group: job-offer-ai-normalizer
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Test offer normalization and dynamic presentation
        run: deno test supabase/functions/job-offer-ai-normalize/normalizer.test.ts
      - name: Invoke bounded Gemini normalization batch
        env:
          NORMALIZER_URL: https://mpoyaegtwtmhookdzqdy.supabase.co/functions/v1/job-offer-ai-normalize
          REQUESTED_BATCH_SIZE: ${{ github.event_name == 'workflow_dispatch' && inputs.batch_size || 5 }}
        run: |
          BODY="$(python - <<'PY'
          import json, os
          size = max(1, min(int(os.environ["REQUESTED_BATCH_SIZE"]), 10))
          print(json.dumps({"batchSize": size}))
          PY
          )"
          OIDC_TOKEN="$(curl --fail-with-body --silent --show-error -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=jobly-harvest")"
          TOKEN="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$OIDC_TOKEN")"
          test -n "$TOKEN" || { echo "GitHub Actions OIDC token unavailable"; exit 1; }
          RESPONSE_FILE="$(mktemp)"
          HTTP_STATUS="$(curl --silent --show-error --output "$RESPONSE_FILE" --write-out '%{http_code}' -X POST "$NORMALIZER_URL" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data "$BODY" || true)"
          RESPONSE="$(cat "$RESPONSE_FILE")"
          rm -f "$RESPONSE_FILE"
          if ! [[ "$HTTP_STATUS" =~ ^2[0-9][0-9]$ ]]; then
            echo "$RESPONSE"
          python - "$RESPONSE" <<'PY'
          import json, sys
          result = json.loads(sys.argv[1])
          if not result.get("configured", False):
              raise SystemExit(result.get("reason", "Gemini Edge Function is not configured."))
          if not result.get("ok", False):
              raise SystemExit(result.get("message", "Gemini normalization failed."))
          print("Gemini normalizer configured; processed:", result.get("processed", 0))
          PY
            echo "Offer AI normalizer returned HTTP $HTTP_STATUS"
            exit 1
          fi
          echo "$RESPONSE"
