name: Africa Source Shadow Crawl

on:
  workflow_dispatch:
    inputs:
      countries:
        description: "Comma-separated ISO country codes"
        required: false
        default: "CF,TD,CG,CD,GA,GQ,ST,BI"
  push:
    branches:
      - feat/africa-central-sources-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: africa-shadow-crawl-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shadow-crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run shadow crawl
        env:
          COUNTRIES: ${{ inputs.countries || 'CF,TD,CG,CD,GA,GQ,ST,BI' }}
        run: |
          IFS=',' read -ra CODES <<< "$COUNTRIES"
          deno run --allow-net supabase/functions/discover-jobs/shadow-crawl.ts "${CODES[@]}" | tee africa-shadow-crawl.json
      - name: Validate report exists
        run: |
          test -s africa-shadow-crawl.json
          python - <<'PY'
          import json
          with open("africa-shadow-crawl.json", "r", encoding="utf-8") as f:
              data = json.load(f)
          required = ["countries", "sources", "accessible", "failed", "pages", "totalDiscovered", "totalExtracted", "totalEligible", "duration"]
          missing = [k for k in required if k not in data]
          if missing:
              raise SystemExit(f"Missing report fields: {missing}")
          print(json.dumps({
              "countries": data["countries"],
              "sources": data["sources"],
              "accessible": data["accessible"],
              "failed": data["failed"],
              "pages": data["pages"],
              "totalDiscovered": data["totalDiscovered"],
              "totalExtracted": data["totalExtracted"],
              "totalEligible": data["totalEligible"],
              "duration": data["duration"],
          }, ensure_ascii=False, indent=2))
          PY
      - name: Upload shadow report
        uses: actions/upload-artifact@v4
        with:
          name: africa-shadow-crawl
          path: africa-shadow-crawl.json
          retention-days: 14
