name: Africa Source Shadow Crawl

on:
  workflow_dispatch:
    inputs:
      countries:
        description: "Comma-separated ISO country codes"
        required: false
        default: "CF,TD,CG,CD,GA,GQ,ST,BI"
  push:
    branches:
      - feat/africa-central-sources-v1
  pull_request:
    branches:
      - main

concurrency:
  group: africa-shadow-crawl
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shadow-crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run shadow crawl
        env:
          COUNTRIES: ${{ inputs.countries || 'CF,TD,CG,CD,GA,GQ,ST,BI' }}
        run: |
          IFS=',' read -ra CODES <<< "$COUNTRIES"
          deno run --allow-net supabase/functions/discover-jobs/shadow-crawl.ts "${CODES[@]}" | tee africa-shadow-crawl.json
      - name: Validate report exists
        run: |
          test -s africa-shadow-crawl.json
          python - <<'PY'
          import json
          with open("africa-shadow-crawl.json", "r", encoding="utf-8") as f:
              data = json.load(f)
          summary = data.get("summary", data)
          required = ["countries", "sources", "accessible", "failed", "listingPages", "detailPages", "discoveredUrls", "totalExtracted", "totalEligible", "expired", "rejected", "durationMs"]
          missing = [k for k in required if k not in summary]
          if missing:
              raise SystemExit(f"Missing report fields: {missing}")
          if summary["sources"] != len(data.get("metrics", [])):
              raise SystemExit("Report source count does not match metrics")
          print(json.dumps({
              "countries": summary["countries"],
              "sources": summary["sources"],
              "accessible": summary["accessible"],
              "failed": summary["failed"],
              "listingPages": summary["listingPages"],
              "detailPages": summary["detailPages"],
              "discoveredUrls": summary["discoveredUrls"],
              "expired": summary["expired"],
              "rejected": summary["rejected"],
              "totalExtracted": summary["totalExtracted"],
              "totalEligible": summary["totalEligible"],
              "durationMs": summary["durationMs"],
          }, ensure_ascii=False, indent=2))
          PY
      - name: Upload shadow report
        uses: actions/upload-artifact@v4
        with:
          name: africa-shadow-crawl
          path: africa-shadow-crawl.json
          retention-days: 14
