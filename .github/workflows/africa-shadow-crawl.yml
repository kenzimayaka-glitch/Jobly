name: Africa Source Shadow Crawl
# A source batch is crawled in shadow mode first; production ingestion stays approval-gated.

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/discover-jobs/shadow-crawl.ts"
      - "supabase/functions/discover-jobs/exhaustive-crawler.ts"
      - "supabase/functions/discover-jobs/date-extraction.ts"
      - "supabase/functions/discover-jobs/source-registry.ts"
      - "supabase/functions/_shared/application-contact.ts"
      - "supabase/functions/_shared/application-readiness.ts"
      - "supabase/functions/job-harvest-ingest/index.ts"
      - "supabase/functions/job-harvest-process/index.ts"
      - ".github/workflows/africa-shadow-crawl.yml"
  workflow_dispatch:
    inputs:
      countries:
        description: "Comma-separated ISO country codes"
        required: false
        default: "CM,DZ,EG,LY,MA,MR,TN,BJ,BF,CV,CI,GM,GH,GN,GW,LR,ML,NE,NG,SN,SL,TG,CF,TD,CG,CD,GQ,GA,ST,BI,AO,KE,UG,TZ,RW,ET,DJ,ER,SO,SS,SD,KM,MG,MU,SC,ZA,ZM,ZW,MW,MZ,NA,BW,SZ,LS"
      source_keys:
        description: "20 source keys maximum, separated by commas"
        required: false
        default: "inep_mozambique,lmis_sl,nelex_ng,ajira_portal,sica_anpe_bj,zimbabwe_psc_erecruitment,anpe_bj,anpe_bf,anpe_ne,anpetogo,essa_sa,hrjobs_liberia,iefp_cv,kenya_psc_jobs,oppz_zambia_jobs,onem_app_cd,senjob_sn,south_africa_gov_jobs,beta_mauritania,botswana_mof_recruitment"
      apply:
        description: "Allow ingesting only after explicit approval"
        required: true
        type: boolean
        default: false
  schedule:
    - cron: "17 */6 * * *"
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: africa-shadow-crawl
  cancel-in-progress: true

jobs:
  validate-harvest-readiness:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Test application contact and readiness rules
        run: deno test supabase/functions/_shared/application-contact.test.ts supabase/functions/_shared/application-readiness.test.ts
      - name: Type-check modified harvest functions
        run: |
          deno check --node-modules-dir=auto supabase/functions/discover-jobs/shadow-crawl.ts
          deno check --node-modules-dir=auto supabase/functions/job-harvest-ingest/index.ts
          deno check --node-modules-dir=auto supabase/functions/job-harvest-process/index.ts

  shadow-crawl:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Test application contact and availability rules
        run: |
          deno test supabase/functions/_shared/application-contact.test.ts
          deno test supabase/functions/_shared/application-readiness.test.ts
      - name: Type-check source batch crawler
        run: deno check supabase/functions/discover-jobs/shadow-crawl.ts
      - name: Run source batch shadow crawl
        env:
          COUNTRIES: ${{ inputs.countries || 'CM,DZ,EG,LY,MA,MR,TN,BJ,BF,CV,CI,GM,GH,GN,GW,LR,ML,NE,NG,SN,SL,TG,CF,TD,CG,CD,GQ,GA,ST,BI,AO,KE,UG,TZ,RW,ET,DJ,ER,SO,SS,SD,KM,MG,MU,SC,ZA,ZM,ZW,MW,MZ,NA,BW,SZ,LS' }}
          SOURCE_KEYS: ${{ inputs.source_keys || (github.event_name == 'push' && 'inep_mozambique,lmis_sl,nelex_ng,ajira_portal,sica_anpe_bj,zimbabwe_psc_erecruitment,anpe_bj,anpe_bf,anpe_ne,anpetogo,essa_sa,hrjobs_liberia,iefp_cv,kenya_psc_jobs,oppz_zambia_jobs,onem_app_cd,senjob_sn,south_africa_gov_jobs,beta_mauritania,botswana_mof_recruitment') || '' }}
        run: |
          IFS=',' read -ra CODES <<< "$COUNTRIES"
          if [ -n "$SOURCE_KEYS" ]; then
            KEY_COUNT="$(python -c 'import os; print(len(set(x.strip() for x in os.environ["SOURCE_KEYS"].split(",") if x.strip())))')"
            test "$KEY_COUNT" -le 20 || { echo "A source batch is limited to 20 unique keys"; exit 1; }
            export SOURCE_KEYS
            deno run --allow-net --allow-write --allow-env=SOURCE_KEYS supabase/functions/discover-jobs/shadow-crawl.ts "${CODES[@]}" | tee africa-shadow-crawl.json
          else
            deno run --allow-net --allow-write supabase/functions/discover-jobs/shadow-crawl.ts "${CODES[@]}" | tee africa-shadow-crawl.json
          fi
      - name: Validate shadow report
        run: |
          test -s africa-shadow-crawl.json
          test -s africa-shadow-harvest-candidates.json
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          data = json.load(open("africa-shadow-crawl.json", encoding="utf-8"))
          summary = data.get("summary", data)
          required = ["sources", "totalExtracted", "totalEligible", "contactAccepted", "contactRejected", "contactMissingDisplayable", "missingPublicationDate", "freshnessRejected", "harvestCandidates"]
          missing = [key for key in required if key not in summary]
          if missing:
              raise SystemExit(f"Missing report fields: {missing}")
          candidates = json.load(open("africa-shadow-harvest-candidates.json", encoding="utf-8"))
          bad_date = [x for x in candidates if not x.get("published")]
          bad_identity = [x for x in candidates if not x.get("sourceKey") or not x.get("title") or not x.get("countryCode")]
          from urllib.parse import urlparse
          bad_source = [x for x in candidates if urlparse(x.get("url", "")).scheme not in ("http", "https") or not urlparse(x.get("url", "")).netloc]
          bad_readiness = [x for x in candidates if not isinstance(x.get("applicationReady"), bool) or x.get("applicationReady") != bool(x.get("applicationEmail") or x.get("applicationPhone") or x.get("applicationUrl") or x.get("applyUrl"))]
          if bad_date or bad_identity or bad_source or bad_readiness:
              raise SystemExit(f"Invalid candidates: date={len(bad_date)}, identity={len(bad_identity)}, source_url={len(bad_source)}, readiness={len(bad_readiness)}")
          now = datetime.now(timezone.utc)
          stale = []
          future = []
          for item in candidates:
              try:
                  published = datetime.fromisoformat(item["published"].replace("Z", "+00:00"))
                  max_age_days = 30 if item.get("publicationDateEstimated") else 62
                  age_seconds = (now - published).total_seconds()
                  if age_seconds > max_age_days * 86400: stale.append(item)
                  if age_seconds < -300: future.append(item)
              except Exception: stale.append(item)
          if stale or future:
              raise SystemExit(f"Invalid freshness: stale={len(stale)}, future={len(future)}")
          print(json.dumps({key: summary[key] for key in required}, ensure_ascii=False, indent=2))
          direct = sum(1 for item in candidates if item.get("applicationReady"))
          print(f"Candidate rows validated: {len(candidates)} (direct_apply={direct}, source_only={len(candidates)-direct})")
          PY
      - name: Push candidates to JobHarvestCapture
        if: (github.event_name == 'workflow_dispatch' && inputs.apply == true) || (github.event_name == 'push' && (contains(github.event.head_commit.message, 'JOBLY-LOT1-INGEST-ONCE-20261104') || contains(github.event.head_commit.message, 'JOBLY-LOT1-SA-RECOVERY-ONCE-20261104') || contains(github.event.head_commit.message, 'JOBLY-LOT1-SA-RECOVERY-V2-ONCE-20261104')))
        env:
          INGEST_URL: https://mpoyaegtwtmhookdzqdy.supabase.co/functions/v1/job-harvest-ingest
          SOURCE_KEYS: ${{ inputs.source_keys || 'inep_mozambique,lmis_sl,nelex_ng,ajira_portal,sica_anpe_bj,zimbabwe_psc_erecruitment,anpe_bj,anpe_bf,anpe_ne,anpetogo,essa_sa,hrjobs_liberia,iefp_cv,kenya_psc_jobs,oppz_zambia_jobs,onem_app_cd,senjob_sn,south_africa_gov_jobs,beta_mauritania,botswana_mof_recruitment' }}
          SOURCE_URLS: ${{ (contains(github.event.head_commit.message, 'JOBLY-LOT1-SA-RECOVERY-ONCE-20261104') || contains(github.event.head_commit.message, 'JOBLY-LOT1-SA-RECOVERY-V2-ONCE-20261104')) && 'https://www.labour.gov.za/driver-messenger-(2)|https://www.labour.gov.za/administration-clerk-projects|https://www.labour.gov.za/accounting-clerk-(4)' || '' }}
        run: |
          KEY_COUNT="$(python -c 'import os; print(len(set(x.strip() for x in os.environ["SOURCE_KEYS"].split(",") if x.strip())))')"
          test "$KEY_COUNT" -ge 1 -a "$KEY_COUNT" -le 20 || { echo "Explicit approval requires 1–20 source keys"; exit 1; }
          OIDC_TOKEN="$(curl --fail-with-body --silent --show-error -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=jobly-harvest")"
          TOKEN="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$OIDC_TOKEN")"
          test -n "$TOKEN" || { echo "GitHub Actions OIDC token unavailable"; exit 1; }
          python - <<'PY'
          import json, os
          candidates = json.load(open("africa-shadow-harvest-candidates.json", encoding="utf-8"))
          only_urls = {x.strip() for x in os.environ.get("SOURCE_URLS", "").split("|") if x.strip()}
          if only_urls:
              candidates = [x for x in candidates if x.get("url") in only_urls]
              missing = only_urls - {x.get("url") for x in candidates}
              if missing:
                  raise SystemExit(f"Missing recovery candidates: {sorted(missing)}")
          if not candidates:
              raise SystemExit("No candidate rows to ingest.")
          for i in range(0, len(candidates), 500):
              with open(f"/tmp/jobly-harvest-{i//500}.json", "w", encoding="utf-8") as f:
                  json.dump({"items": candidates[i:i+500]}, f, ensure_ascii=False)
          print(f"Prepared {(len(candidates)+499)//500} ingestion batch(es)")
          PY
          shopt -s nullglob
          for batch in /tmp/jobly-harvest-*.json; do
            echo "Sending $batch"
            curl --fail-with-body --silent --show-error --retry 3 --retry-delay 5 -X POST "$INGEST_URL" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data-binary "@$batch"
            echo
          done
      - name: Process approved first-batch captures
        if: (github.event_name == 'workflow_dispatch' && inputs.apply == true) || (github.event_name == 'push' && (contains(github.event.head_commit.message, 'JOBLY-LOT1-INGEST-ONCE-20261104') || contains(github.event.head_commit.message, 'JOBLY-LOT1-SA-RECOVERY-ONCE-20261104') || contains(github.event.head_commit.message, 'JOBLY-LOT1-SA-RECOVERY-V2-ONCE-20261104')))
        env:
          PROCESS_URL: https://mpoyaegtwtmhookdzqdy.supabase.co/functions/v1/job-harvest-process
          SOURCE_KEYS: ${{ inputs.source_keys || 'inep_mozambique,lmis_sl,nelex_ng,ajira_portal,sica_anpe_bj,zimbabwe_psc_erecruitment,anpe_bj,anpe_bf,anpe_ne,anpetogo,essa_sa,hrjobs_liberia,iefp_cv,kenya_psc_jobs,oppz_zambia_jobs,onem_app_cd,senjob_sn,south_africa_gov_jobs,beta_mauritania,botswana_mof_recruitment' }}
        run: |
          OIDC_TOKEN="$(curl --fail-with-body --silent --show-error -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=jobly-harvest")"
          TOKEN="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$OIDC_TOKEN")"
          test -n "$TOKEN" || { echo "GitHub Actions OIDC token unavailable"; exit 1; }
          BODY="$(python - <<'PY'
          import json, os
          keys = list(dict.fromkeys(x.strip() for x in os.environ["SOURCE_KEYS"].split(",") if x.strip()))
          if not keys or len(keys) > 20:
              raise SystemExit("Provide between 1 and 20 source keys.")
          print(json.dumps({"limit":40,"sourceKeys":keys}))
          PY
          )"
          for pass in $(seq 1 25); do
            RESPONSE="$(curl --fail-with-body --silent --show-error --retry 3 --retry-delay 5 -X POST "$PROCESS_URL" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data "$BODY")"
            echo "$RESPONSE"
            SELECTED="$(python -c 'import json,sys; print(int(json.load(sys.stdin).get("selected",0)))' <<< "$RESPONSE")"
            test "$SELECTED" -ge 40 || break
          done

      - name: Upload shadow report
        uses: actions/upload-artifact@v4
        with:
          name: africa-shadow-crawl
          path: |
            africa-shadow-crawl.json
            africa-shadow-harvest-candidates.json
          retention-days: 14
