name: Jobly Security Core — isolated migration tests
on:
  pull_request:
    branches: [main]
  push:
    branches: ["feat/**", "fix/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-core-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jobly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jobly"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create representative roles, tables and legacy policies
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jobly
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          CREATE SCHEMA net;
          CREATE FUNCTION net.http_post(text) RETURNS bigint LANGUAGE sql AS 'SELECT 1::bigint';
          CREATE TABLE public."Job" ("id" text PRIMARY KEY, "isActive" boolean NOT NULL DEFAULT true);
          CREATE TABLE public."RecruiterJob" ("id" text PRIMARY KEY, "status" text NOT NULL DEFAULT 'published');
          CREATE TABLE public."Company" ("id" text PRIMARY KEY, "name" text NOT NULL);
          CREATE TABLE public."JobHarvestCapture" ("id" text PRIMARY KEY, "status" text NOT NULL);
          CREATE TABLE public."JobOfferPipeline" ("id" text PRIMARY KEY);
          CREATE TABLE public."JobSource" ("id" text PRIMARY KEY);
          GRANT ALL ON public."Job", public."RecruiterJob", public."Company", public."JobHarvestCapture", public."JobOfferPipeline", public."JobSource" TO PUBLIC, anon, authenticated, service_role;
          ALTER TABLE public."Job" ENABLE ROW LEVEL SECURITY;
          ALTER TABLE public."RecruiterJob" ENABLE ROW LEVEL SECURITY;
          ALTER TABLE public."Company" ENABLE ROW LEVEL SECURITY;
          ALTER TABLE public."JobHarvestCapture" ENABLE ROW LEVEL SECURITY;
          ALTER TABLE public."JobOfferPipeline" ENABLE ROW LEVEL SECURITY;
          ALTER TABLE public."JobSource" ENABLE ROW LEVEL SECURITY;
          CREATE POLICY "deny_client_access" ON public."JobOfferPipeline" FOR ALL TO anon, authenticated USING (false) WITH CHECK (false);
          CREATE POLICY "deny_client_access" ON public."JobSource" FOR ALL TO anon, authenticated USING (false) WITH CHECK (false);
          CREATE POLICY "Job_active_select" ON public."Job" FOR SELECT TO PUBLIC USING ("isActive" = true);
          CREATE POLICY "p2_recruiter_job_select" ON public."RecruiterJob" FOR SELECT TO authenticated USING ("status" = 'published');
          CREATE POLICY "Company_public_select" ON public."Company" FOR SELECT TO PUBLIC USING (true);
          CREATE POLICY "deny_client_access" ON public."JobHarvestCapture" FOR ALL TO anon, authenticated USING (false) WITH CHECK (false);
          SQL
      - name: Apply Security Core migration
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jobly
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261106091500_jobly_security_core.sql
      - name: Apply pg_net client execution lockdown
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jobly
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261106110000_lockdown_pg_net_client_execution.sql
      - name: Verify privileges and atomic limits
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jobly
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/jobly-security-core-migration-smoke.sql
      - name: Apply shared API rate-limit migration
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jobly
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261107040000_api_rate_limit_windows.sql
      - name: Verify API limiter atomic buckets and grants
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jobly
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $verify$
          DECLARE
            first_call record;
            second_call record;
          BEGIN
            SELECT * INTO first_call
            FROM public.consume_api_rate_limit('ci-smoke', repeat('a', 64), 60, 1);
            SELECT * INTO second_call
            FROM public.consume_api_rate_limit('ci-smoke', repeat('a', 64), 60, 1);
            IF NOT first_call.allowed OR second_call.allowed OR second_call.current_count <> 2 THEN
              RAISE EXCEPTION 'API rate-limit RPC did not enforce an atomic request budget';
            END IF;
            IF has_table_privilege('anon', 'public.api_rate_limit_buckets', 'SELECT')
              OR has_table_privilege('authenticated', 'public.api_rate_limit_buckets', 'SELECT') THEN
              RAISE EXCEPTION 'Client roles must not read API rate-limit buckets';
            END IF;
            IF has_function_privilege('anon', 'public.consume_api_rate_limit(text,text,integer,integer)', 'EXECUTE')
              OR has_function_privilege('authenticated', 'public.consume_api_rate_limit(text,text,integer,integer)', 'EXECUTE')
              OR NOT has_function_privilege('service_role', 'public.consume_api_rate_limit(text,text,integer,integer)', 'EXECUTE') THEN
              RAISE EXCEPTION 'API rate-limit RPC grants are incorrect';
            END IF;
          END;
          $verify$;
          SQL
