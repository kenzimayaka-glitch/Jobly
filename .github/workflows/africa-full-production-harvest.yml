name: Africa Full Production Harvest

on:
  push:
    branches:
      - ops/africa-full-harvest-20260930
  pull_request:
    branches:
      - main

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      CRON_SECRET: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Prepare harvest workspace
        run: mkdir -p harvest-results && printf "Africa full harvest\n" > harvest-results/README.txt
      - name: Start Jobly API
        run: |
          npm run dev -- --hostname 127.0.0.1 --port 3000 > /tmp/jobly-next.log 2>&1 &
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1 || curl -fsS http://127.0.0.1:3000/ >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:3000/ >/dev/null
      - name: Resolve active Africa sources
        id: sources
        run: |
          set -euo pipefail
          SOURCES="$(node scripts/africa-active-source-keys.mjs)"
          echo "sources=$SOURCES" >> "$GITHUB_OUTPUT"
          echo "Resolved $(echo "$SOURCES" | tr ',' '\n' | wc -l) active sources."
      - name: Harvest every active source
        env:
          SOURCES: ${{ steps.sources.outputs.sources }}
        run: |
          mkdir -p harvest-results
          IFS=',' read -ra SOURCE_LIST <<< "$SOURCES"
          failed=0
          for source in "${SOURCE_LIST[@]}"; do
            echo "=== HARVEST $source ==="
            file="harvest-results/$source.json"
            set +e
            curl -sS -o "$file" -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Content-Type: application/json" \
              "http://127.0.0.1:3000/api/jobs/ingest/sources?source=$source" > "harvest-results/$source.http"
            status=$(cat "harvest-results/$source.http")
            set -e
            echo "HTTP $status"
            if [ "$status" != "200" ]; then
              failed=$((failed+1))
              cat "$file" || true
              continue
            fi
            node - "$file" <<'NODE'
const fs = require("node:fs");
const d = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
console.log(JSON.stringify({
  source: d.source,
  discovered: d.discovered,
  inserted: d.inserted ?? d.created ?? 0,
  updated: d.updated ?? 0,
  skipped: d.skipped ?? 0,
  rejectedStale: d.rejectedStale ?? 0
}));
NODE
          done
          printf "%s\n" "$failed" > harvest-results/_failed_sources.txt
          if [ "$failed" -gt 0 ]; then exit 1; fi
      - name: Upload harvest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: africa-full-harvest
          path: harvest-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Print server log on failure
        if: failure()
        run: cat /tmp/jobly-next.log || true
