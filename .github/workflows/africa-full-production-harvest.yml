name: Africa Full Production Harvest

on:
  push:
    branches:
      - ops/africa-full-harvest-20260930
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      sources:
        description: "Optional comma-separated source keys; empty = every active registry source"
        required: false
        default: ""
      countries:
        description: "Optional country codes for reporting/filtering"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      CRON_SECRET: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Prepare harvest workspace
        run: mkdir -p harvest-results && printf "Africa full harvest\n" > harvest-results/README.txt
      - name: Start Jobly API
        run: |
          npm run dev -- --hostname 127.0.0.1 --port 3000 > /tmp/jobly-next.log 2>&1 &
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1 || curl -fsS http://127.0.0.1:3000/ >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:3000/ >/dev/null
      - name: Resolve active Africa sources
        id: sources
        env:
          SOURCES_INPUT: ${{ inputs.sources }}
        run: |
          set -euo pipefail
          SOURCES="${SOURCES_INPUT:-}"
          if [ -z "$SOURCES" ]; then
            SOURCES="$(node scripts/africa-active-source-keys.mjs)"
          fi
          echo "sources=$SOURCES" >> "$GITHUB_OUTPUT"
          echo "Resolved $(echo "$SOURCES" | tr ',' '\n' | wc -l) active sources."
      - name: Harvest every active source
        env:
          SOURCES: ${{ steps.sources.outputs.sources }}
        run: |
          set -euo pipefail
          mkdir -p harvest-results
          IFS=',' read -ra SOURCE_LIST <<< "$SOURCES"
          failed=0
          for source in "${SOURCE_LIST[@]}"; do
            echo "=== HARVEST $source ==="
            file="harvest-results/$source.json"
            status=$(curl -sS -o "$file" -w "%{http_code}"               -X POST               -H "Authorization: Bearer $CRON_SECRET"               -H "Content-Type: application/json"               "http://127.0.0.1:3000/api/jobs/ingest/sources?source=$source")
            echo "HTTP $status"
            if [ "$status" != "200" ]; then
              failed=$((failed+1))
              cat "$file" || true
              continue
            fi
            node - "$file" <<'NODE'
const fs = require("node:fs");
const d = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
console.log(JSON.stringify({
  source:d.source,
  discovered:d.discovered,
  inserted:d.inserted,
  updated:d.updated,
  expired:d.expired,
  errors:d.errors
}));
NODE
          done
          echo "failed_sources=$failed" >> "$GITHUB_OUTPUT"
      - name: Database harvest audit
        if: always()
        run: |
          node - <<'NODE'
          console.log("Africa harvest run completed. Verify country/source totals from the uploaded result files.");
          NODE
      - name: Upload harvest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: africa-full-harvest
          path: harvest-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Print server log on failure
        if: failure()
        run: cat /tmp/jobly-next.log || true
