name: Jobly Offer 360 Audit

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit active offers one by one
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      JOB_RENDERER_URL: ${{ secrets.JOB_RENDERER_URL }}
      JOB_RENDERER_TOKEN: ${{ secrets.JOB_RENDERER_TOKEN }}
      JOB_RENDERER_WAIT_MS: ${{ secrets.JOB_RENDERER_WAIT_MS }}
      AUDIT_LIMIT: "1000"
      AUDIT_CONCURRENCY: "5"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run real offer-by-offer audit
        run: node scripts/offer-pipeline-audit.mjs
      - name: Publish audit report summary to job
        if: always()
        run: |
          if [ -f audit-output/offers-audit.json ]; then
            node - <<'NODE'
            const fs = require('fs');
            const r = JSON.parse(fs.readFileSync('audit-output/offers-audit.json','utf8'));
            const s = r.statistics || {};
            const out = process.env.GITHUB_STEP_SUMMARY;
            const lines = [
              '# Jobly Offer 360 Audit — reference summary',
              '',
              'Offers analysées: **' + r.total + '**',
              'Score moyen: **' + Number(s.mean ?? 0).toFixed(2) + '**',
              '',
              '| Contrôle | Résultat |',
              '|---|---:|',
              ...Object.entries(s.issueRates || {}).map(([k,v]) => '| ' + k + ' | **' + v.count + '/' + r.total + '** |'),
              '',
              'PASS: **' + (s.pass ?? 0) + '** · WARNING: **' + (s.warning ?? 0) + '** · BLOCKED: **' + (s.blocked ?? 0) + '**'
            ];
            fs.appendFileSync(out, lines.join('\\n') + '\\n');
            NODE
          else
            echo 'audit-output/offers-audit.json absent' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jobly-offer-360-audit
          path: audit-output/
          if-no-files-found: warn
