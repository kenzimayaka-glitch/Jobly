name: Jobly Offer 360 Audit

on:
  push:
    branches:
      - main
      - analysis/duplication-v3-integrated-20260930
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit active offers one by one
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      JOB_RENDERER_URL: ${{ secrets.JOB_RENDERER_URL }}
      JOB_RENDERER_TOKEN: ${{ secrets.JOB_RENDERER_TOKEN }}
      JOB_RENDERER_WAIT_MS: ${{ secrets.JOB_RENDERER_WAIT_MS }}
      AUDIT_LIMIT: "1000"
      AUDIT_CONCURRENCY: "5"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run real offer-by-offer audit
        run: node scripts/offer-pipeline-audit.mjs
      - name: Run contradiction-based duplication V3
        run: |
          node scripts/duplication-v3-contradiction.mjs --self-test
          node scripts/duplication-v3-contradiction.mjs audit-output/offers-audit.json audit-output/duplication-v3-report.json
      - name: Publish V3 summary to job
        if: always()
        run: |
          if [ -f audit-output/duplication-v3-report.json ]; then
            node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync("audit-output/duplication-v3-report.json","utf8"));const s=r.summary||{};const lines=["## Duplication V3 — contradiction","",`Offres: **${s.offersAnalyzed}** · unités sémantiques: **${s.unitsAnalyzed}** · constats: **${s.findings}**`,"","| Décision | Nombre |","|---|---:|"];for(const [k,v] of Object.entries(s.byDecision||{}))lines.push(`| ${k} | **${v}** |`);lines.push("","### Ventilation par source","","| Source | Offres | Constats | Duplications | Templates | À revoir |","|---|---:|---:|---:|---:|---:|");for(const [k,v] of Object.entries(s.bySource||{}))lines.push(`| ${k} | ${v.offers} | ${v.findings} | ${v.duplication} | ${v.templates} | ${v.review} |`);fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join("\\n")+"\\n")'
          else
            echo 'Rapport V3 absent : audit ou analyse en échec.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish audit report summary to job
        if: always()
        run: |
          if [ -f audit-output/offers-audit.json ]; then
            node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync("audit-output/offers-audit.json","utf8"));const s=r.statistics||{};const lines=["# Jobly Offer 360 Audit — reference summary",`"Offers analysées: **${r.total}**"`,`"Score moyen: **${Number(s.mean??0).toFixed(2)}**"`,"","| Contrôle | Résultat |","|---|---:|"];for(const [k,v] of Object.entries(s.issueRates||{}))lines.push(`| ${k} | **${v.count}/${r.total}** |`);lines.push("",`PASS: **${s.pass??0}** · WARNING: **${s.warning??0}** · BLOCKED: **${s.blocked??0}**`);fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join("\\n")+"\\n")'
          else
            echo 'audit-output/offers-audit.json absent' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jobly-offer-360-audit
          path: audit-output/
          if-no-files-found: warn
