name: 360 offer audit

on:
  push:
    branches:
      - "fix/offer-360-audit"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm dlx @playwright/test@1.55.0 install --with-deps chromium
      - name: Run 248-offer rendered audit
        env:
          SUPABASE_URL: https://mpoyaegtwtmhookdzqdy.supabase.co
          SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1wb3lhZWd0d3dtaG9va2R6cWR5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4MTAzODAsImV4cCI6MjEwNDM4NjM4MH0.yVDX02xI6_t3ew6HpFIOYBR8yReDw7rybyH0xq6vwFo
        run: pnpm dlx @playwright/test@1.55.0 test scripts/offer-360-audit.spec.ts --workers=1
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offer-360-audit
          path: offer-360-audit.json
          if-no-files-found: warn
