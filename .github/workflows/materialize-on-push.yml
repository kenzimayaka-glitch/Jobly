name: Materialize Jobly source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ hashFiles('Jobly-V23-Fix-Abonnement-CTA-16-09-2026.zip') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Jobly-V23-Fix-Abonnement-CTA-16-09-2026.zip"
          rm -rf /tmp/jobly-src
          mkdir -p /tmp/jobly-src
          unzip -q "$ZIP" -d /tmp/jobly-src

          SRC=""
          while IFS= read -r pkg; do
            DIR=$(dirname "$pkg")
            if [ -d "$DIR/app" ] || [ -d "$DIR/pages" ]; then
              SRC="$DIR"
              break
            fi
          done < <(find /tmp/jobly-src -type f -name package.json -print)

          test -n "$SRC"
          test -f "$SRC/package.json"
          test -d "$SRC/app" -o -d "$SRC/pages"

          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' ! -name 'Jobly-V23-Fix-Abonnement-CTA-16-09-2026.zip' -exec rm -rf {} +
          cp -a "$SRC"/. ./
          rm -f "$ZIP"
          rm -rf /tmp/jobly-src
      - name: Commit source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: materialize actual Jobly Next.js source root"
          git push origin HEAD:main
