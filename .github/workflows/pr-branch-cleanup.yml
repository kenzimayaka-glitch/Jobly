name: Delete merged PR branch safely

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: delete-merged-branch-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  delete-branch:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify merged source branch is no longer referenced
        id: verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPO}"
          headers=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          encoded="$(jq -rn --arg value "${BRANCH}" '$value|@uri')"

          open_prs="$(curl -fsS "${headers[@]}" "${api}/pulls?state=open&per_page=100")"
          if jq -e --arg branch "${BRANCH}" 'any(.[]; .head.ref == $branch or .base.ref == $branch)' >/dev/null <<<"${open_prs}"; then
            echo "::notice::Branch ${BRANCH} remains referenced by another open PR; leaving it untouched."
            exit 0
          fi

          branch_response="$(curl -fsS "${headers[@]}" "${api}/branches/${encoded}")"
          actual_sha="$(jq -r '.commit.sha' <<<"${branch_response}")"
          protected="$(jq -r '.protected' <<<"${branch_response}")"

          if [[ "${actual_sha}" != "${EXPECTED_SHA}" ]]; then
            echo "::notice::Branch ${BRANCH} advanced after the merged PR; preserving it."
            exit 0
          fi
          if [[ "${protected}" != "false" ]]; then
            echo "::notice::Branch ${BRANCH} is protected; preserving it."
            exit 0
          fi
          if [[ "${BRANCH}" == "${{ github.event.repository.default_branch }}" ]]; then
            echo "::error::Refusing to delete the default branch."
            exit 1
          fi

          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "sha=${EXPECTED_SHA}" >> "$GITHUB_OUTPUT"
          echo "Verified ${BRANCH} @ ${EXPECTED_SHA}; no open PR references it."

      - name: Delete verified merged branch
        if: steps.verify.outputs.branch != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ steps.verify.outputs.branch }}
          EXPECTED_SHA: ${{ steps.verify.outputs.sha }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPO}"
          encoded="$(jq -rn --arg value "${BRANCH}" '$value|@uri')"
          headers=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json")
          open_prs="$(curl -fsS "${headers[@]}" "${api}/pulls?state=open&per_page=100")"
          if jq -e --arg branch "${BRANCH}" 'any(.[]; .head.ref == $branch or .base.ref == $branch)' >/dev/null <<<"${open_prs}"; then
            echo "::error::Another open PR now references ${BRANCH}; refusing deletion."
            exit 1
          fi
          branch_response="$(curl -fsS "${headers[@]}" "${api}/branches/${encoded}")"
          actual_sha="$(jq -r '.commit.sha' <<<"${branch_response}")"
          protected="$(jq -r '.protected' <<<"${branch_response}")"
          [[ "${actual_sha}" == "${EXPECTED_SHA}" && "${protected}" == "false" && "${BRANCH}" != "main" ]] || {
            echo "::error::Branch changed between verification and deletion; refusing to delete."
            exit 1
          }
          code="$(curl -sS -o /tmp/delete-response -w '%{http_code}' -X DELETE "${headers[@]}" "${api}/git/refs/heads/${encoded}")"
          if [[ "${code}" == "204" ]]; then
            echo "Deleted merged branch ${BRANCH} @ ${EXPECTED_SHA}."
          elif [[ "${code}" == "404" ]]; then
            echo "Branch ${BRANCH} was already removed."
          else
            echo "::error::Delete failed for ${BRANCH}: HTTP ${code}"
            cat /tmp/delete-response
            exit 1
          fi
