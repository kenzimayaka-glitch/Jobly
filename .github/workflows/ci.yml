name: Jobly CI — Typecheck & Build

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "fix/**"
      - "feat/**"
      - "chore/**"
  workflow_dispatch:

concurrency:
  group: jobly-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Career OS architecture gate
        run: pnpm test:career-os

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint — canonical offer files
        run: >-
          pnpm dlx @biomejs/biome@2.2.6 lint
          app/jobs/[id]/page.tsx
          lib/offerBlocks.ts
          scripts/offer-blocks-test.ts
          scripts/offer-blocks-playwright.mjs
          components/EcosystemSelector.tsx
          app/api/recruitment360/offers/[id]/respond/route.ts
          --diagnostic-level=error

      - name: Production build
        run: pnpm build

      - name: Compile and run canonical offer tests — 30 + independent 10 + active simulation
        run: |
          rm -rf .offer-blocks-test
          pnpm exec tsc scripts/offer-blocks-test.ts lib/offerBlocks.ts lib/jobContent.ts --target ES2022 --module commonjs --moduleResolution node --esModuleInterop --skipLibCheck --outDir .offer-blocks-test
          node .offer-blocks-test/scripts/offer-blocks-test.js

      - name: Install Playwright test runner
        run: pnpm add -D @playwright/test@1.55.0

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: Start local Next.js app
        run: |
          pnpm dev --hostname 127.0.0.1 --port 3000 > offer-blocks-next.log 2>&1 &
          echo $! > offer-blocks-next.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/jobs >/dev/null 2>&1; then
              echo "Next.js ready after $i attempts"
              exit 0
            fi
            sleep 2
          done
          cat offer-blocks-next.log
          exit 1

      - name: Playwright — 30 real offers + desktop/mobile captures
        run: pnpm exec node scripts/offer-blocks-playwright.mjs

      - name: Upload offer blocks evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offer-blocks-proof-${{ github.run_id }}
          path: |
            artifacts/
            offer-blocks-audit-report.json
            offer-blocks-next.log
          if-no-files-found: warn
          retention-days: 14
