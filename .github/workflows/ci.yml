name: Jobly CI — Typecheck & Build

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "fix/**"
      - "feat/**"
      - "chore/**"
  workflow_dispatch:

concurrency:
  group: jobly-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jia-conversation-migration:
    name: J’IA conversation migration — isolated PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jobly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jobly"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Create the existing Jobly User and Supabase roles
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jobly
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          CREATE TABLE public."User" ("id" text PRIMARY KEY);
          SQL

      - name: Apply J’IA canonical conversation migration
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jobly
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/database/prisma/migrations/20261106080000_jia_canonical_conversations/migration.sql

      - name: Verify privileges, RLS, constraints and idempotency
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jobly
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/jia-conversation-migration-smoke.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/database/prisma/migrations/20261106080000_jia_canonical_conversations/migration.sql

  admin-360-migrations:
    name: Admin 360 & Intelligence 360 — isolated PostgreSQL migrations
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jobly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jobly"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create minimal Supabase-compatible schema
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jobly
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (id uuid PRIMARY KEY);
          CREATE SCHEMA net;
          GRANT ALL ON SCHEMA net TO PUBLIC, anon, authenticated, service_role;
          CREATE FUNCTION net.http_post(text) RETURNS bigint LANGUAGE sql AS $$ SELECT 1::bigint $$;
          GRANT EXECUTE ON FUNCTION net.http_post(text) TO PUBLIC, anon, authenticated, service_role;
          CREATE TABLE public."User" (
            "id" text PRIMARY KEY,
            "createdAt" timestamptz NOT NULL DEFAULT now(),
            "country" text
          );
          -- Existing source with a timestamp column but no rows: the BI backfill
          -- must persist explicit observed zeros rather than fabricate missing data.
          CREATE TABLE public."Job" (
            "id" text PRIMARY KEY,
            "createdAt" timestamptz NOT NULL DEFAULT now()
          );
          CREATE TABLE public."Payment" (
            "id" text PRIMARY KEY,
            "createdAt" timestamptz NOT NULL DEFAULT now(),
            "paidAt" timestamptz,
            "amount" numeric(18,2),
            "currency" text,
            "status" text
          );
          GRANT SELECT ON public."User", public."Job", public."Payment" TO service_role;
          SQL
      - name: Apply Admin 360 and BI migrations in order
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jobly
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261106101400_admin_360_workspaces.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261106110000_lockdown_pg_net_client_execution.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261106115000_admin_managed_accounts.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261106123000_admin_support_community_operations.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261106140000_jobly_intelligence_360.sql
      - name: Verify RLS, grants, root singleton and BI backfill
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jobly
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/admin-360-migration-smoke.sql

  validate:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: LOT-00 private media contract and isolated runtime-unit tests
        run: node --experimental-strip-types --test scripts/e2e/lot00-private-media-contract.test.mjs scripts/e2e/lot00-private-media-runtime.test.mjs

      - name: P2 Community, Bons Plans and Campus gate
        run: pnpm test:p2-ecosystem

      - name: Company logo fallback regression tests
        run: pnpm test:company-logo-fallback
      - name: Authentication and Google account selection regression tests
        run: pnpm test:auth

      - name: P2 Jobly offer watermark regression tests
        run: pnpm test:p2-offer-watermark

      - name: P2 free HIBP password screening tests
        run: pnpm test:p2-hibp

      - name: Jobly Security Core rate-limit and hardening tests
        run: pnpm test:security-core

      - name: J’IA 360 adaptive experience engine tests
        run: pnpm test:jia-experience

      - name: Career OS architecture gate
        run: pnpm test:career-os

      - name: Mission Afrique P0 regression tests
        run: pnpm test:africa-p0

      - name: Event Core P1 regression tests
        run: pnpm test:event-core

      - name: Billing lifecycle regression tests
        run: pnpm test:billing

      - name: Mobile Money SMS payment regression tests
        run: node --experimental-strip-types --test scripts/payment-sms-parser.test.mjs scripts/payment-sms-matching.test.mjs scripts/payment-sms-config.test.mjs scripts/payment-sms-devices.test.mjs scripts/payment-sms-ai.test.mjs scripts/payment-sms-android.test.mjs scripts/payment-sms-customer-share.test.mjs

      - name: Mobility P1 business and access regression tests
        run: pnpm test:mobility-p1

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Mission Afrique date extraction tests
        run: deno test supabase/functions/discover-jobs/date-extraction.test.ts

      - name: Validate Prisma schema
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jobly?schema=public
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/jobly?schema=public
        run: pnpm db:validate

      - name: Offline-first, encrypted backup and device-session regression tests
        run: pnpm test:offline-first

      - name: ATS recruiter score and keyword regression tests
        run: pnpm test:ats-service

      - name: Typecheck
        run: pnpm typecheck

      - name: Production build
        run: pnpm build

      - name: LOT-00 HTTP runtime smoke — protected upload and recruiter routes
        run: node scripts/e2e/lot00-http-runtime-smoke.mjs

  recruiter-talent-ai-regression:
    name: Recruiter ATS & Talent AI — independent validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: ATS and Talent/Recruteur functional regression tests
        run: pnpm test:ats-service

      - name: Typecheck
        run: pnpm typecheck

      - name: Production build
        run: pnpm build

