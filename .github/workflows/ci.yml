name: Jobly CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: jobly-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build & validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
